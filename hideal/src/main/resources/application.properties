spring.application.name=hideal
server.port=8888

hideal.cors.allowed-origins=http://127.0.0.1:5173,http://localhost:5173,http://localhost:3000

spring.datasource.url=jdbc:h2:mem:hideal
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
