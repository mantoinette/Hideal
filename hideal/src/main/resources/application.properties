spring.application.name=hideal
# Local default 8888; Render sets PORT / SERVER_PORT to 8080
server.port=${PORT:${SERVER_PORT:8888}}

hideal.cors.allowed-origins=${HIDEAL_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173,http://localhost:3000}

# PostgreSQL — override with env vars on Render
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hideal_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
